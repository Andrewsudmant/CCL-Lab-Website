name: Bluesky network diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      - name: Attempt two public search results without bypasses
        run: PYTHONPATH=. python -m current_conversations.run --adapter bluesky --limit 2 --output bluesky-diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bluesky-network-diagnostic-${{ github.run_id }}
          path: bluesky-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
