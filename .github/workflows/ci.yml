name: Site checks

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Validate records and run tests
        run: make validate test

      - name: Build site
        run: make build

      - name: Check internal links
        run: python scripts/check_links.py

      - name: Run static accessibility checks
        run: python scripts/check_accessibility.py

      - name: Upload built site for review
        uses: actions/upload-artifact@v4
        with:
          name: ccll-site
          path: _site
          if-no-files-found: error
          retention-days: 7
