name: Current Conversations bounded discovery

on:
  schedule:
    - cron: "17 14 * * 2,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Explicit discovery mode"
        type: choice
        options: [fixture-only, live-academic, bluesky, staging-write]
        default: fixture-only

concurrency:
  group: current-conversations-private-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_MODE: ${{ inputs.mode || 'fixture-only' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: python -m pip install -r requirements-dev.txt
      - run: make check
      - name: Run explicit bounded mode
        run: PYTHONPATH=. python scripts/run_current_conversations_pilot.py --mode "$RUN_MODE" --limit 2
      - uses: actions/upload-artifact@v4
        with:
          name: current-conversations-${{ github.run_id }}
          path: |
            reports/current-conversations
            staging/current-conversations/current
            calibration/current-conversations-generator
          if-no-files-found: error
          retention-days: 14

  write-private-staging-branch:
    needs: discover-and-test
    if: ${{ (inputs.mode || 'fixture-only') == 'staging-write' && vars.CURRENT_CONVERSATIONS_STAGING_WRITE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: automation/current-conversations-staging}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=. python scripts/run_current_conversations_pilot.py --mode staging-write
      - run: python scripts/stage_current_conversations.py --verify-only --branch automation/current-conversations-staging
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-conversations/generated staging/current-conversations reports/current-conversations/runs state/current-conversations/budget current-conversations/feed.json current-conversations/feed.xml
          python scripts/stage_current_conversations.py --verify-only --branch automation/current-conversations-staging --paths $(git diff --cached --name-only)
          git diff --cached --quiet || git commit -m "Update private Current Conversations staging"
          git push origin HEAD:automation/current-conversations-staging

# The write job is disabled unless the repository variable is exactly true, targets
# only automation/current-conversations-staging, verifies an allowlist, and never
# deploys or writes to main. Paid discovery fails closed unless all controls exist.
