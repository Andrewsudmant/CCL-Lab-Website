name: Publication metadata refresh plan

concurrency:
  group: publication-metadata-private-proposal
  cancel-in-progress: false

on:
  schedule:
    - cron: "31 15 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=. python scripts/refresh_publications.py --output-dir reports/content
      - run: make validate test
      - uses: actions/upload-artifact@v4
        with:
          name: publication-refresh-plan-${{ github.run_id }}
          path: reports/content
          retention-days: 14

# A future metadata fetch must open a pull request. Scheduled work does not write
# directly to the protected branch, and owner overrides always take precedence.
