name: Research Watch scheduled candidate run

concurrency:
  group: research-watch-private-staging
  cancel-in-progress: false

on:
  schedule:
    - cron: "17 14 * * 2,5"
  workflow_dispatch:
    inputs:
      use_openai:
        description: "Run the OpenAI web-search adapter when its secret is configured"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bounded-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate control plane
        run: make validate test
      - name: Run transactional private pilot
        env:
          RESEARCH_WATCH_AUTOPUBLISH_ENABLED: ${{ vars.RESEARCH_WATCH_AUTOPUBLISH_ENABLED }}
        run: PYTHONPATH=. python scripts/run_research_watch_pilot.py --limit-per-query 4
      - name: Optional OpenAI web search
        if: ${{ inputs.use_openai == true }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_MAX_COST_PER_RUN: ${{ vars.OPENAI_MAX_COST_PER_RUN }}
          OPENAI_MAX_ITEMS_PER_RUN: ${{ vars.OPENAI_MAX_ITEMS_PER_RUN }}
        run: PYTHONPATH=. python -m research_watch.run --adapter openai_web_search --limit 5 --output reports/pilot/openai-web.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-watch-candidates-${{ github.run_id }}
          path: |
            reports/pilot
            staging/research-watch/current
            calibration/research-watch
          if-no-files-found: error
          retention-days: 14

# Private artefacts only. This workflow has read-only repository permission, cannot
# write to main, and does not deploy. RESEARCH_WATCH_AUTOPUBLISH_ENABLED remains a
# future control and must default to false.
