project:
  type: website
  output-dir: _site
  pre-render: scripts/pre-render.sh
  render:
    - "*.qmd"
    - "research-watch/index.qmd"
    - "research-watch/methods.qmd"
    - "research/themes/*.qmd"
    - "projects/*.qmd"
    - "publications/*.qmd"
    - "docs/*.md"
    - "docs/adr/*.md"
    - "!generated/*.qmd"

website:
  title: "Cities & Climate Learning Lab"
  description: "Research on how cities generate, transfer and use evidence for climate action."
  navbar:
    background: light
    foreground: dark
    pinned: true
    collapse-below: lg
    title: "Cities & Climate Learning Lab"
    left:
      - href: research.qmd
        text: Research
      - href: projects.qmd
        text: Projects
      - href: people.qmd
        text: People
      - href: publications.qmd
        text: Publications
      - href: research-watch/index.qmd
        text: Research Watch
      - href: data-tools.qmd
        text: Data & Tools
      - href: opportunities.qmd
        text: Opportunities
      - href: about-andrew.qmd
        text: About Andrew
      - href: contact.qmd
        text: Contact
  page-footer:
    left: |
      **Cities & Climate Learning Lab**<br>
      School of Resource and Environmental Management, Simon Fraser University
    right: |
      Gate 2–3A development build · no public deployment<br>
      [Research Watch method](/research-watch/methods.html) · [Content governance](/docs/content-governance.html)
  search: true
  reader-mode: false
  back-to-top-navigation: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    lang: en-CA
    link-external-newwindow: false
    anchor-sections: true
    smooth-scroll: true
    include-after-body: assets/site-scripts.html

execute:
  freeze: auto
