project:
  type: website
  output-dir: _site
  pre-render: scripts/pre-render.sh
  render:
    - "*.qmd"
    - "research-watch/index.qmd"
    - "research-watch/methods.qmd"
    - "research/themes/*.qmd"
    - "projects/*.qmd"
    - "publications/*.qmd"
    - "!generated/*.qmd"

website:
  title: "Cities & Climate Learning Lab"
  description: "Research on how cities generate, transfer and use evidence for climate action."
  navbar:
    background: light
    foreground: dark
    pinned: true
    collapse-below: lg
    title: "Cities & Climate Learning Lab"
    left:
      - href: research.qmd
        text: Research
      - href: projects.qmd
        text: Projects
      - href: people.qmd
        text: People
      - text: Outputs
        menu:
          - href: outputs.qmd
            text: Outputs overview
          - href: publications.qmd
            text: Publications
          - href: data-tools.qmd
            text: Data & Tools
      - href: research-watch/index.qmd
        text: Watch
      - href: opportunities.qmd
        text: Opportunities
      - text: About
        menu:
          - href: about-andrew.qmd
            text: About Andrew
          - href: contact.qmd
            text: Contact
          - href: research-watch/methods.qmd
            text: Research Watch methods
  page-footer:
    left: |
      **Cities & Climate Learning Lab**<br>
      School of Resource and Environmental Management, Simon Fraser University
    right: |
      [andrew_sudmant@sfu.ca](mailto:andrew_sudmant@sfu.ca) · [Research Watch method](/research-watch/methods.html)<br>
      [Report a correction or broken source](/contact.html) ·
      AI-assisted discovery; original sources remain authoritative.
  search: true
  reader-mode: false
  back-to-top-navigation: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    lang: en-CA
    link-external-newwindow: false
    anchor-sections: true
    smooth-scroll: true
    include-after-body: assets/site-scripts.html

execute:
  freeze: auto
