project:
  type: website
  output-dir: _site
  pre-render: scripts/pre-render.sh
  render:
    - "*.qmd"
    - "current-conversations/*.qmd"
    - "research-watch/*.qmd"
    - "research/themes/*.qmd"
    - "research/*.qmd"
    - "work/*.qmd"
    - "projects/*.qmd"
    - "publications/*.qmd"
    - "!generated/*.qmd"
    - "!staging/**/*.qmd"

website:
  title: "Cities & Climate Learning Lab"
  favicon: assets/favicon.svg
  description: "Research on how cities generate, transfer and use evidence for climate action."
  navbar:
    background: light
    foreground: dark
    pinned: true
    collapse-below: lg
    title: "Cities & Climate Learning Lab"
    left:
      - href: research.qmd
        text: Research
      - href: work.qmd
        text: Work
      - href: people.qmd
        text: People
      - text: Outputs
        menu:
          - href: outputs.qmd
            text: Outputs overview
          - href: publications.qmd
            text: Publications
          - href: data-tools.qmd
            text: Data & Tools
      - href: current-conversations/index.qmd
        text: Current Conversations
      - href: opportunities.qmd
        text: Opportunities
      - text: About
        menu:
          - href: about-andrew.qmd
            text: About Andrew
          - href: contact.qmd
            text: Contact
          - href: current-conversations/how-it-works.qmd
            text: How Current Conversations works
  page-footer:
    left: |
      **Cities & Climate Learning Lab**<br>
      School of Resource and Environmental Management, Simon Fraser University
    right: |
      [andrew_sudmant@sfu.ca](mailto:andrew_sudmant@sfu.ca) · [Current Conversations method](/current-conversations/how-it-works.html)<br>
      [Report a correction or broken source](/contact.html) ·
      AI-assisted discovery; original sources remain authoritative.
  search: true
  reader-mode: false
  back-to-top-navigation: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    lang: en-CA
    link-external-newwindow: false
    anchor-sections: true
    smooth-scroll: true
    include-after-body: assets/site-scripts.html

resources:
  - current-conversations/feed.json
  - current-conversations/feed.xml

execute:
  freeze: auto
