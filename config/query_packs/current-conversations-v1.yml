  bluesky:
    - {id: cc-b01-learning, query_version: "1.0.0", source_environment: bluesky, theme: urban-climate-learning, query: '"urban climate" (learning OR evidence)', provider_parameters: {endpoint: app.bsky.feed.searchPosts, sort: latest}, lookback_days: 30, languages: [en], geographies: [global], exclusions: [routine reposts], result_limit: 5, priority: low, last_run: null}
    - {id: cc-b02-governance, query_version: "1.0.0", source_environment: bluesky, theme: climate-governance-delivery, query: '"municipal climate" (delivery OR implementation)', provider_parameters: {endpoint: app.bsky.feed.searchPosts, sort: latest}, lookback_days: 30, languages: [en], geographies: [global], exclusions: [routine reposts], result_limit: 5, priority: low, last_run: null}
