    - {id: cc-b05-tools, query_version: "1.0.0", source_environment: bluesky, theme: evidence-infrastructure-tools, query: '"climate data" (city OR municipal) tool', provider_parameters: {endpoint: app.bsky.feed.searchPosts, sort: latest}, lookback_days: 30, languages: [en], geographies: [global], exclusions: [routine reposts], result_limit: 5, priority: low, last_run: null}
    - {id: cc-b06-canada, query_version: "1.0.0", source_environment: bluesky, theme: canadian-climate-policy, query: '(Canada OR "British Columbia") "climate policy"', provider_parameters: {endpoint: app.bsky.feed.searchPosts, sort: latest}, lookback_days: 30, languages: [en, fr], geographies: [canada, british-columbia], exclusions: [routine reposts], result_limit: 5, priority: medium, last_run: null}
controls:
