    - {id: cc-w05-tools, query_version: "1.0.0", source_environment: data-and-tools, theme: evidence-infrastructure-tools, query: "new municipal climate data decision support tool methodology", provider_parameters: {search_type: web_search, preferred_roles: [dataset-or-tool]}, lookback_days: 30, languages: [en], geographies: [global], exclusions: [undocumented dashboards], result_limit: 6, priority: high, last_run: null}
    - {id: cc-w06-canada, query_version: "1.0.0", source_environment: policy-and-institutions, theme: canadian-climate-policy, query: "recent Canada British Columbia municipal Indigenous intergovernmental climate policy implementation", provider_parameters: {search_type: web_search, preferred_roles: [official-policy-source, official-announcement, independent-analysis]}, lookback_days: 30, languages: [en, fr], geographies: [canada, british-columbia], exclusions: [Canada incidental], result_limit: 8, priority: high, last_run: null}
