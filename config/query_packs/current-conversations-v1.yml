query_pack_id: current-conversations-v1
version: "1.0.0"
default_lookback_days: 30
global_exclusions:
  - generic corporate promotion without substantive evidence or methods
  - content without a substantive connection to a lab theme
  - duplicate press-release syndication and routine social reposts
  - unverifiable claims and search-result pages rather than original sources
  - title-only academic records for substantive summaries
  - MDPI academic content
queries:
  academic:
    - {id: cc-a01-learning, query_version: "1.0.0", source_environment: academic-research, theme: urban-climate-learning, query: "municipal climate policy learning evidence transfer", provider_parameters: {work_types: [article, preprint], search_field: title_and_abstract, language: en}, lookback_days: 30, languages: [en], geographies: [global], exclusions: [non-urban learning], result_limit: 8, priority: high, last_run: null}
    - {id: cc-a02-governance, query_version: "1.0.0", source_environment: academic-research, theme: climate-governance-delivery, query: "urban climate governance implementation delivery capacity", provider_parameters: {work_types: [article, preprint], search_field: title_and_abstract, language: en}, lookback_days: 30, languages: [en], geographies: [global], exclusions: [technical studies without governance], result_limit: 8, priority: high, last_run: null}
    - {id: cc-a03-cobenefits, query_version: "1.0.0", source_environment: academic-research, theme: co-benefits-place-based-valuation, query: "city climate co-benefits co-costs place-based valuation", provider_parameters: {work_types: [article, preprint], search_field: title_and_abstract, language: en}, lookback_days: 30, languages: [en], geographies: [global], exclusions: [generic cost benefit analysis], result_limit: 8, priority: high, last_run: null}
    - {id: cc-a04-workforce, query_version: "1.0.0", source_environment: academic-research, theme: just-transitions-workforce, query: "urban just transition occupations workforce skills", provider_parameters: {work_types: [article, preprint], search_field: title_and_abstract, language: en}, lookback_days: 30, languages: [en], geographies: [global], exclusions: [national forecasts without place interpretation], result_limit: 8, priority: high, last_run: null}
    - {id: cc-a05-tools, query_version: "1.0.0", source_environment: academic-research, theme: evidence-infrastructure-tools, query: "urban climate evidence infrastructure decision support tools", provider_parameters: {work_types: [article, preprint], search_field: title_and_abstract, language: en}, lookback_days: 30, languages: [en], geographies: [global], exclusions: [tool announcements without methods], result_limit: 8, priority: high, last_run: null}
    - {id: cc-a06-canada, query_version: "1.0.0", source_environment: academic-research, theme: canadian-climate-policy, query: "Canada British Columbia municipal climate policy implementation", provider_parameters: {work_types: [article, preprint], search_field: title_and_abstract, language: en}, lookback_days: 30, languages: [en, fr], geographies: [canada, british-columbia], exclusions: [Canada incidental], result_limit: 8, priority: high, last_run: null}
