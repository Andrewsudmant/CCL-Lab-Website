    - {id: cc-c03-cobenefits, query_version: "1.0.0", source_environment: blogs-and-commentary, theme: co-benefits-place-based-valuation, query: "place-based climate co-benefits practitioner analysis", provider_parameters: {search_type: web_search, preferred_roles: [research-commentary, practitioner-commentary]}, lookback_days: 30, languages: [en], geographies: [global], exclusions: [promotion], result_limit: 4, priority: medium, last_run: null}
    - {id: cc-c04-workforce, query_version: "1.0.0", source_environment: blogs-and-commentary, theme: just-transitions-workforce, query: "local just transition workforce skills practitioner commentary", provider_parameters: {search_type: web_search, preferred_roles: [research-commentary, practitioner-commentary]}, lookback_days: 30, languages: [en], geographies: [global], exclusions: [routine reposts], result_limit: 4, priority: medium, last_run: null}
    - {id: cc-c05-tools, query_version: "1.0.0", source_environment: data-and-tools, theme: evidence-infrastructure-tools, query: "municipal climate evidence tool documentation release", provider_parameters: {search_type: web_search, preferred_roles: [dataset-or-tool, research-commentary]}, lookback_days: 30, languages: [en], geographies: [global], exclusions: [undocumented tools], result_limit: 4, priority: medium, last_run: null}
