    - {id: cc-w02-governance, query_version: "1.0.0", source_environment: news-and-analysis, theme: climate-governance-delivery, query: "recent municipal climate implementation delivery governance analysis", provider_parameters: {search_type: web_search, preferred_roles: [official-policy-source, news-reporting]}, lookback_days: 30, languages: [en], geographies: [global], exclusions: [press release syndication], result_limit: 6, priority: high, last_run: null}
