query_pack_id: research-watch-v1
version: "2.0.0"
maximum_lookback_days: 30
result_limit_per_query: 12
global_exclusions:
  - generic corporate sustainability promotion without methods or evidence
  - climate content without an urban, governance, valuation, workforce, evidence-system or Canadian-policy contribution
  - duplicate press-release syndication
source_queries:
  openalex:
    - id: urban-learning-transfer
      themes: [urban-climate-learning]
      query: urban climate policy learning
    - id: urban-learning-geography
      themes: [urban-climate-learning, evidence-infrastructure-tools]
      query: urban climate knowledge transfer
    - id: governance-delivery-institutions
      themes: [climate-governance-delivery]
      query: urban climate governance
    - id: governance-delivery-modes
      themes: [climate-governance-delivery]
      query: city climate implementation
    - id: cobenefits-place
      themes: [co-benefits-place-based-valuation]
      query: climate co-benefits cities
    - id: cobenefits-costs
      themes: [co-benefits-place-based-valuation]
      query: climate action valuation
    - id: workforce-occupations
      themes: [just-transitions-workforce]
      query: green transition workforce
    - id: workforce-switching
      themes: [just-transitions-workforce]
      query: climate occupations skills
    - id: evidence-tools
      themes: [evidence-infrastructure-tools]
      query: urban climate decision support
    - id: evidence-mapping
      themes: [evidence-infrastructure-tools]
      query: urban climate data tools
    - id: canadian-policy-federal
      themes: [canadian-climate-policy]
      query: Canada municipal climate
    - id: canadian-policy-bc
      themes: [canadian-climate-policy]
      query: British Columbia climate
  crossref:
    - id: doi-enrichment
      themes: []
      query: metadata enrichment by DOI for records found by other adapters
  openai_web_search:
    - id: reports-news-tools
      themes: [urban-climate-learning, climate-governance-delivery, co-benefits-place-based-valuation, just-transitions-workforce, evidence-infrastructure-tools, canadian-climate-policy]
      query: recent credible reports, news, commentary and decision tools matching the versioned research scope
  bluesky:
    - id: bounded-practitioner-search
      themes: [urban-climate-learning, climate-governance-delivery, evidence-infrastructure-tools, canadian-climate-policy]
      query: '(urban climate OR municipal climate OR Canadian climate policy)'
controls:
  maximum_new_items_per_run: 12
  maximum_items_per_source_domain: 4
  maximum_items_per_event_cluster: 1
  maximum_items_per_theme: 8
  minimum_source_types_when_available: 3
  homepage_display_count: 6
  homepage_maximum_per_domain: 2
  archive_age_days: 365
  minimum_primary_theme_score: 0.65
  minimum_secondary_theme_score: 0.55
