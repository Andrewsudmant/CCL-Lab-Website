short_bio: >-
  Andrew Sudmant is an Assistant Professor in Simon Fraser University’s School of
  Resource and Environmental Management and Director of the Cities and Climate
  Learning Lab. His research examines how cities and governments design, evaluate
  and deliver climate action, with particular interests in urban climate policy,
  co-benefits, policy appraisal, evidence transfer and decision-support tools. He is
  a Lead Author for Chapter 5 of the IPCC Special Report on Climate Change and Cities.
full_bio: >-
  Andrew Sudmant is an Assistant Professor in the School of Resource and
  Environmental Management at Simon Fraser University, where he directs the Cities
  and Climate Learning Lab. Trained as an economist, he studies how cities and
  governments can move from climate commitments to practical implementation.

  His research combines climate-policy and economic modelling, public-policy
  appraisal and the development of decision-support tools. He is particularly
  interested in how climate action across housing, transport, energy and urban
  infrastructure affects affordability, mobility, health, resilience and access to
  opportunity. Across this work, he examines how analytical choices about behaviour,
  value, time, geography and distribution shape which policies appear desirable and
  whose costs and benefits become visible.

  Before joining Simon Fraser University, Andrew worked at the Edinburgh Climate
  Change Institute at the University of Edinburgh, where he led and contributed to
  research on place-based climate action, the wider social and economic consequences
  of net zero, and evidence tools for local and national decision-makers. He is a Lead
  Author for Chapter 5, “Solutions by City Types and Regions,” of the IPCC Special
  Report on Climate Change and Cities.
