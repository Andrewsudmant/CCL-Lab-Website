id: andrew-sudmant
name: Andrew Sudmant
role: Assistant Professor
affiliation: School of Resource and Environmental Management, Simon Fraser University
bio: >-
  Andrew Sudmant researches how urban climate action is governed, delivered and
  valued, including the co-benefits of low-carbon development and the evidence
  systems cities use. He is an Assistant Professor in Simon Fraser University's
  School of Resource and Environmental Management and a Lead Author for Chapter 5
  of the IPCC Special Report on Climate Change and Cities.
