record_id: climate-delivery-modes
title: Climate delivery modes
status: in-development
relationship_to_lab: current-lab-research
relationship_note: Owner-approved current programme of the Cities and Climate Learning Lab.
summary: >-
  A comparative programme examining how public authorities, infrastructure providers,
  businesses, civil-society organisations, communities and financial actors combine
  to deliver urban climate action, and how those arrangements vary across city types,
  sectors and regions.
research_questions:
  - Which combinations of actors and institutions enable urban climate implementation?
  - How do delivery arrangements vary across city types, sectors and regions?
start_date: null
end_date: null
primary_theme: modes-of-climate-delivery
secondary_themes: [geographies-of-climate-learning]
decision_or_problem: >-
  How cities can make climate action operable and durable through configurations
  of authority, finance, coordination, implementation and maintenance.
delivery_conditions: >-
  The programme examines combinations of public authority, infrastructure provision,
  finance, civic participation and organisational capability rather than treating a
  delivery mode as an intervention or sector label.
evidence_status: Owner-approved programme description; comparative empirical work is in development.
claim_boundaries: No delivery configuration is presented as universally suitable or effective.
next_learning_question: Which delivery conditions recur across places, and which remain context dependent?
