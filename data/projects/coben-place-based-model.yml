record_id: coben-place-based-model
title: "CoBen: place-based co-benefits and co-costs"
status: in-development
relationship_to_lab: current-lab-research
relationship_note: Owner-approved current programme of the Cities and Climate Learning Lab.
summary: >-
  A conditional, place-based scenario model for assessing co-benefits and co-costs
  of climate action across domestic buildings, diet and active travel. The programme
  separates baseline evidence, scenario action, assignment, physical or behavioural
  effects, causal pathways, endpoints and valuation, with explicit traceability and
  locality rules.
research_questions:
  - How can local climate scenarios represent co-benefits and co-costs without obscuring causal assumptions?
  - How should evidence, geography and valuation choices be governed and traced?
