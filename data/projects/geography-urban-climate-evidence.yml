summary: >-
  Research examining where urban climate evidence is produced, which cities can
  readily learn from that evidence, and how geographic gaps shape evidence transfer.
research_questions:
  - How is urban climate evidence distributed across cities and regions?
  - Which places are well represented in the evidence available to other cities?
