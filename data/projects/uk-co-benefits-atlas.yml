summary: >-
  An interactive place-based atlas estimating benefits and costs of climate action
  for more than 46,000 UK communities across eleven benefit and cost categories.
research_questions:
  - How do the benefits and costs of climate action vary between UK communities?
  - How can place-based evidence make local climate choices more transparent?
