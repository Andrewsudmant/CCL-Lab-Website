record_id: uk-co-benefits-atlas
title: UK Co-Benefits Atlas
status: active
summary: >-
  An interactive place-based atlas estimating the benefits and costs of climate
  action for more than 46,000 UK communities. The public tool reports eleven
  benefit and cost categories and is intended to support local climate planning.
research_questions:
  - How do the benefits and costs of climate action vary between UK communities?
  - How can place-based evidence make local climate choices more transparent?
