record_id: urban-climate-evidence-map
title: Mapping urban climate research and learning geographies
status: active
summary: >-
  A connected programme mapping the global urban climate literature and examining
  where research is produced, how it travels and which places remain poorly served.
  Public outputs include an AI-assisted evidence map of 53,295 papers and a 2026
  preprint on the geographies of urban climate learning.
research_questions:
  - What does the global urban climate evidence base cover and omit?
  - How do research production and evidence access vary between cities and regions?
