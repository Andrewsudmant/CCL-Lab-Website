idea_id: c1-distributional-reversals
theme_id: consequences-for-people-and-places
working_title: Distributional reversals over time
question: Can a climate programme that appears progressive initially become regressive over time, or the reverse?
problem_of_understanding: Upfront subsidies, operating savings, property-price effects and tax or tariff changes may occur on different schedules and affect different populations.
why_it_may_matter: Static appraisal can misrepresent who ultimately gains or bears costs when the distribution of consequences changes across implementation stages.
possible_research_design: Longitudinal microsimulation and cohort analysis, supported by linked administrative or household data, could examine how incidence changes over time.
suggested_methods: [longitudinal microsimulation, cohort analysis, linked administrative data, household-distribution analysis, scenario modelling]
possible_geographies: [British Columbia, Canada, comparative international cities]
possible_sectors: [buildings, transport, energy]
possible_climate_domains: [mitigation]
display_order: 1
owner_review_status: owner-approved
disclaimer: Research idea · not currently an active or funded project
