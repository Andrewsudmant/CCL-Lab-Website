idea_id: c3-social-cohesion
theme_id: consequences-for-people-and-places
working_title: Climate action and social cohesion
question: Under which conditions does climate action strengthen trust and collective capacity, and when does perceived unfairness erode them?
problem_of_understanding: Social cohesion is often treated as a background condition for climate action rather than a consequence that policy itself can build or damage.
why_it_may_matter: Policies that alter trust, reciprocity or collective capacity may affect both social outcomes and the durability of later climate action.
possible_research_design: Panel surveys, social-network measures and natural or quasi-experimental variation in programme exposure could be combined with comparative neighbourhood case studies.
suggested_methods: [panel surveys, social-network analysis, natural experiments, neighbourhood comparison, mixed-method longitudinal research]
public_method_tags: [panel surveys, social-network analysis, natural experiments]
narrative_tier: additional
reader_or_decision_at_stake: Municipal programme designers considering trust and collective capacity.
possible_geographies: [British Columbia, Canada, comparative international cities]
possible_sectors: [urban planning, transport, buildings]
possible_climate_domains: [mitigation, adaptation]
display_order: 3
owner_review_status: owner-approved
