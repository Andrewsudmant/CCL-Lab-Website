idea_id: c4-benefits-stay-burdens-move
theme_id: consequences-for-people-and-places
working_title: Where benefits stay and burdens move
question: When do urban climate investments retain employment, income, ownership and health benefits locally, and when do they shift costs or risks elsewhere?
problem_of_understanding: A programme may appear locally beneficial while relying on distant labour, extractive supply chains or displaced environmental and social burdens.
why_it_may_matter: Appraisal boundaries can make local gains visible while hiding consequences outside the city.
possible_research_design: Multi-regional input–output analysis, supply-chain tracing, ownership mapping and geospatial incidence analysis could connect local outcomes to consequences elsewhere.
suggested_methods: [multi-regional input–output analysis, supply-chain tracing, ownership mapping, geospatial incidence analysis, territorial and consumption accounting]
possible_geographies: [British Columbia, Canada, comparative international cities]
possible_sectors: [buildings, transport, energy]
possible_climate_domains: [mitigation]
display_order: 4
owner_review_status: owner-approved
disclaimer: Research idea · not currently an active or funded project
