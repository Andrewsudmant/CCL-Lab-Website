idea_id: c5-delivery-contingent-co-benefits
theme_id: consequences-for-people-and-places
working_title: Delivery-contingent co-benefits
question: Which wider benefits depend on how an intervention is delivered rather than on the intervention alone?
problem_of_understanding: Two cities may adopt the same technology but produce different employment, health, affordability or cohesion outcomes because procurement, ownership, participation and financing differ.
why_it_may_matter: Treating co-benefits as properties of technologies can conceal the institutional mechanisms that create or distribute them.
possible_research_design: Matched intervention cases and mechanism-focused process evaluation could separate intervention effects from effects associated with delivery configuration.
suggested_methods: [matched intervention comparison, mechanism-focused evaluation, mediation analysis, process tracing, mixed-method appraisal]
possible_geographies: [British Columbia, Canada, comparative international cities]
possible_sectors: [buildings, transport, energy]
possible_climate_domains: [mitigation, adaptation]
display_order: 5
owner_review_status: owner-approved
disclaimer: Research idea · not currently an active or funded project
