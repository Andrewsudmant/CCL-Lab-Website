idea_id: d1-same-policy-different-delivery
theme_id: modes-of-climate-delivery
working_title: Same policy, different delivery
question: Why do policies with the same formal label depend on different institutional configurations and follow different implementation trajectories?
problem_of_understanding: Classifying climate action by intervention or policy instrument can conceal the mechanisms that make it operable in one city and ineffective in another.
why_it_may_matter: Apparent policy similarity may mislead cities about which authority, finance, capabilities and relationships are required for implementation.
possible_research_design: Matched comparative cases and qualitative comparative analysis could identify recurring combinations of authority, finance, capability and participation, with process tracing used to test proposed mechanisms.
suggested_methods: [matched case comparison, qualitative comparative analysis, process tracing, institutional mapping, configurational analysis]
possible_geographies: [British Columbia, Canada, comparative international cities]
possible_sectors: [buildings, transport, energy]
possible_climate_domains: [mitigation, adaptation]
display_order: 1
owner_review_status: owner-approved
disclaimer: Research idea · not currently an active or funded project
