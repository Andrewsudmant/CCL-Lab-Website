idea_id: d2-delivery-lifecycle
theme_id: modes-of-climate-delivery
working_title: Delivery across the policy lifecycle
question: How do delivery arrangements change between policy adoption, early implementation, expansion, maintenance and repair?
problem_of_understanding: A configuration that secures initial adoption may not be capable of sustaining investment, maintaining infrastructure or adapting after political change.
why_it_may_matter: Treating delivery as a single implementation stage can hide why programmes weaken or require different institutional arrangements over time.
possible_research_design: Longitudinal process tracing and event-sequence analysis could reconstruct how responsibilities, resources and coalitions shift across a policy’s lifecycle.
suggested_methods: [longitudinal process tracing, event-sequence analysis, policy-archive analysis, organisational interviews, implementation-history comparison]
public_method_tags: [longitudinal process tracing, event-sequence analysis, policy-archive analysis]
narrative_tier: additional
reader_or_decision_at_stake: Researchers examining implementation and institutional durability.
possible_geographies: [British Columbia, Canada, comparative international cities]
possible_sectors: [buildings, transport, energy]
possible_climate_domains: [mitigation, adaptation]
display_order: 2
owner_review_status: owner-approved
disclaimer: Research idea · not currently an active or funded project
