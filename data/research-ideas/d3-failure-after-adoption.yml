idea_id: d3-failure-after-adoption
theme_id: modes-of-climate-delivery
working_title: Failure after adoption
question: Why do technically credible and formally adopted urban climate policies stall before producing durable change?
problem_of_understanding: Research frequently treats formal adoption as an outcome, leaving subsequent dilution, delay, suspension or abandonment poorly explained.
why_it_may_matter: Understanding post-adoption failure could reveal delivery conditions that are invisible when success is measured through policy commitment alone.
possible_research_design: Purposeful comparison of stalled and sustained programmes could combine bottleneck analysis, administrative records and interviews with actors positioned at key decision points.
suggested_methods: [comparative failure analysis, bottleneck analysis, administrative-data analysis, process tracing, decision-point interviews]
possible_geographies: [British Columbia, Canada, comparative international cities]
possible_sectors: [buildings, transport, energy]
possible_climate_domains: [mitigation, adaptation]
display_order: 3
owner_review_status: owner-approved
disclaimer: Research idea · not currently an active or funded project
