idea_id: d4-institutional-substitution
theme_id: modes-of-climate-delivery
working_title: Institutional substitution and its costs
question: When can utilities, businesses, community organisations or intermediaries compensate for limited municipal capacity, and what is lost when they do?
problem_of_understanding: Non-municipal actors may enable action while changing accountability, public control, access or the distribution of risk.
why_it_may_matter: Institutional substitution should not be treated as an unqualified increase in capacity when it also redistributes authority and responsibility.
possible_research_design: Governance-network analysis and tracing of financial, legal and operational responsibilities could compare substituted functions across cities, complemented by analysis of legitimacy and distribution.
suggested_methods: [governance-network analysis, responsibility mapping, comparative institutional analysis, financial-flow tracing, legitimacy analysis]
possible_geographies: [British Columbia, Canada, comparative international cities]
possible_sectors: [utilities, buildings, transport]
possible_climate_domains: [mitigation, adaptation]
display_order: 4
owner_review_status: owner-approved
disclaimer: Research idea · not currently an active or funded project
