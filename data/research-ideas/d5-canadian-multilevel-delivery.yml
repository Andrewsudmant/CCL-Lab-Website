idea_id: d5-canadian-multilevel-delivery
theme_id: modes-of-climate-delivery
working_title: Multilevel climate delivery in Canada
question: Under which federal–provincial–municipal arrangements do cities gain durable authority and resources for climate action, and when do they receive fragmented mandates instead?
problem_of_understanding: Canadian municipalities often carry implementation responsibilities while depending on other governments for statutory authority, finance and programme continuity.
why_it_may_matter: Intergovernmental programmes may enable municipal delivery or transfer responsibility without the durable resources and powers required to act.
possible_research_design: Comparative federalism, intergovernmental fiscal analysis and paired municipal cases could distinguish enabling arrangements from fragmented mandates.
suggested_methods: [comparative federalism, intergovernmental fiscal analysis, paired municipal cases, policy-network analysis, institutional analysis]
public_method_tags: [comparative federalism, intergovernmental fiscal analysis, paired municipal cases]
narrative_tier: additional
reader_or_decision_at_stake: Intergovernmental actors designing municipal climate mandates and finance.
possible_geographies: [British Columbia, Canada]
possible_sectors: [urban governance]
possible_climate_domains: [mitigation, adaptation]
