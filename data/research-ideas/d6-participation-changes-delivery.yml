idea_id: d6-participation-changes-delivery
theme_id: modes-of-climate-delivery
working_title: Participation that changes delivery
question: When does public or community participation alter authority, resources or programme design, and when does it merely legitimate a predetermined decision?
problem_of_understanding: Participation is frequently listed as part of delivery without establishing whether it changes the mechanism or distribution of decision-making.
why_it_may_matter: Distinguishing consequential participation from procedural consultation could improve how delivery arrangements are compared and evaluated.
possible_research_design: Decision tracing across comparable programmes, combined with document analysis and interviews with participants and officials, could identify where participation changed choices and where it did not.
suggested_methods: [decision tracing, comparative case study, document analysis, participant interviews, governance analysis]
public_method_tags: [decision tracing, comparative case study, document analysis]
narrative_tier: additional
reader_or_decision_at_stake: Community partners and municipal programme designers.
possible_geographies: [British Columbia, Canada, comparative international cities]
possible_sectors: [urban governance]
possible_climate_domains: [mitigation, adaptation]
