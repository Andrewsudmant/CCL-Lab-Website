idea_id: e3-replication-disagreement
theme_id: where-new-evidence-matters
working_title: Which disagreement deserves replication?
question: When urban climate studies reach conflicting conclusions, which disagreements reflect context, method or chance, and which are worth resolving?
problem_of_understanding: Calls for replication often treat all findings similarly even though some disagreements concern inconsequential details and others destabilise widely used assumptions.
why_it_may_matter: Strategically targeted replication could clarify whether disagreement reflects genuine contextual heterogeneity or avoidable methodological differences.
possible_research_design: Structured replication portfolios, multiverse analysis and Bayesian model comparison could distinguish methodological disagreement from genuine contextual variation.
suggested_methods: [coordinated replication, multiverse analysis, Bayesian model comparison, meta-analysis, research-design comparison]
possible_geographies: [Canada, comparative international cities]
possible_sectors: [urban governance]
possible_climate_domains: [mitigation, adaptation]
display_order: 3
owner_review_status: owner-approved
disclaimer: Research idea · not currently an active or funded project
