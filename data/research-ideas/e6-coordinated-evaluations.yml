idea_id: e6-coordinated-evaluations
theme_id: where-new-evidence-matters
working_title: A coordinated network of urban evaluations
question: Could cities design complementary evaluations that answer a shared question rather than producing isolated case studies?
problem_of_understanding: Individually useful studies may remain collectively incomparable because they measure different outcomes, use incompatible designs or repeat the same evidentiary limitations.
why_it_may_matter: Coordinated evaluation could produce stronger cumulative evidence while retaining local adaptation and institutional relevance.
possible_research_design: An adaptive multi-city design could combine common outcome measures, staggered implementation, federated data and pre-agreed comparative hypotheses while allowing local variation.
suggested_methods: [adaptive multi-site evaluation, federated analysis, staggered implementation, common outcome frameworks, comparative causal inference]
public_method_tags: [adaptive multi-site evaluation, federated analysis, staggered implementation]
narrative_tier: additional
reader_or_decision_at_stake: Researchers and city networks designing complementary evaluations.
possible_geographies: [Canada, comparative international cities]
possible_sectors: [urban governance]
possible_climate_domains: [mitigation, adaptation]
