idea_id: g2-reference-city
theme_id: geographies-of-climate-learning
working_title: Who becomes a reference city?
question: How do a small number of cities become influential reference cases, and how does their prominence shape what other cities regard as feasible?
problem_of_understanding: The most visible city cases may become influential because they are well documented or internationally connected rather than because their experience is broadly informative.
why_it_may_matter: Reliance on a small set of reference cities may narrow which policy pathways appear credible and reproduce the existing geography of urban climate knowledge.
possible_research_design: Citation-network analysis, city-network records and policy-document tracing could reconstruct how particular cases acquire authority and how their lessons are reproduced in guidance and municipal plans.
suggested_methods: [citation-network analysis, policy-document tracing, network analysis, natural-language processing, comparative case analysis]
public_method_tags: [citation-network analysis, policy-document tracing, network analysis]
narrative_tier: additional
reader_or_decision_at_stake: Researchers and policy intermediaries selecting precedents.
possible_geographies: [Canada, comparative international cities]
possible_sectors: [urban governance]
possible_climate_domains: [mitigation, adaptation]
display_order: 2
owner_review_status: owner-approved
