idea_id: g3-missing-geography-failure
theme_id: geographies-of-climate-learning
working_title: The missing geography of failure
question: Are abandoned, reversed or unsuccessful urban climate interventions systematically absent from the evidence available to other cities?
problem_of_understanding: Urban climate learning often relies on celebrated or completed cases, while abandoned and reversed interventions remain difficult to locate.
why_it_may_matter: A learning system built mainly from visible successes may overestimate feasibility and conceal the political or institutional conditions under which action fails.
possible_research_design: A registry of discontinued and unsuccessful initiatives, combined with archival research and comparative process tracing, could test whether documented success cases differ systematically from the wider population of interventions.
suggested_methods: [archival research, case-registry development, comparative process tracing, selection-bias analysis, event-history analysis]
public_method_tags: [archival research, case-registry development, comparative process tracing]
narrative_tier: additional
reader_or_decision_at_stake: Researchers building comparative evidence bases.
possible_geographies: [British Columbia, Canada, comparative international cities]
possible_sectors: [urban governance]
possible_climate_domains: [mitigation, adaptation]
display_order: 3
owner_review_status: owner-approved
