idea_id: g5-knowledge-admissibility
theme_id: geographies-of-climate-learning
working_title: Whose knowledge becomes admissible?
question: How do urban evidence systems recognise, subordinate or exclude Indigenous, community and practitioner knowledge?
problem_of_understanding: Formal evidence hierarchies may exclude locally authoritative knowledge or incorporate it without preserving control over interpretation and use.
why_it_may_matter: Decisions may overlook place-specific conditions, while extractive forms of inclusion may reproduce inequities in who owns and authorises knowledge.
possible_research_design: Co-designed comparative research, undertaken only with appropriate partners and data-sovereignty arrangements, could examine how institutions define admissible evidence and how those rules affect decisions.
suggested_methods: [co-designed research, institutional ethnography, comparative case study, governance analysis, knowledge-system mapping]
possible_geographies: [British Columbia, Canada]
possible_sectors: [urban governance]
possible_climate_domains: [mitigation, adaptation]
display_order: 5
owner_review_status: owner-approved
required_qualification: Methods and research governance would need to be developed with appropriate Indigenous or community partners rather than specified unilaterally in advance.
disclaimer: Research idea · not currently an active or funded project
