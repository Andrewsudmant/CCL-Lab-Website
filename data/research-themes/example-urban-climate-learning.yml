name: "PLACEHOLDER — Urban climate learning example"
definition: >-
  A schema example showing how a theme definition, questions, exclusions and
  discovery concepts are stored. The canonical six themes live in the scope configuration.
included_questions:
  - How do municipal organisations translate evidence into climate policy practice?
  - Which networks support durable learning between cities?
