relationship_note: >-
  Research developed before the lab was established and published after Andrew joined Simon Fraser University; foundational to the lab's current delivery programme.
summary: >-
  An ongoing comparative programme examining how authority, finance, organisational capability, infrastructure
  provision, participation, coordination, sequencing and maintenance combine to deliver urban climate action.
research_questions:
  - Which configurations of authority, finance, capability and participation make urban climate action possible and durable?
  - How do delivery arrangements vary across city types, sectors and institutional settings?
