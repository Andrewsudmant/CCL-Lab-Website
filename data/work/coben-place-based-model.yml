problem_of_understanding: >-
  Co-benefit appraisals often report aggregate gains while leaving the causal, geographical, delivery and valuation assumptions behind those estimates difficult to inspect. This can make locally contingent scenarios appear more certain or transferable than they are.
central_question: >-
  How can place-based climate scenarios represent benefits, burdens, costs and distribution without obscuring the assumptions that connect an intervention to those consequences?
how_it_investigates: >-
  The programme develops a conditional model that keeps baseline evidence, scenario actions, causal pathways, endpoints, delivery assumptions and valuation choices distinct and traceable.
reader_value: >-
  The work could clarify which local evidence and modelling choices materially alter an appraisal, allowing scenario users to distinguish conditional consequences from forecasts or universal claims.
decision_or_problem: How to represent locally varying benefits, burdens and costs without obscuring causal, geographic or valuation assumptions.
existing_evidence: The model separates baseline evidence, scenario actions, causal pathways, endpoints and valuation for traceable review.
consequential_uncertainty: Local evidence availability, causal assignment and valuation choices may materially change represented consequences.
delivery_conditions: Delivery and response assumptions remain separate so implementation conditions are not mistaken for outcome evidence.
consequences_examined: Health, equity and other place-based co-benefits, co-costs and distributional outcomes.
evidence_status: Current lab programme; the model remains in development and provisional findings are not presented as public conclusions.
claim_boundaries: Scenarios are conditional appraisals, not forecasts, predictions or universal transferability claims.
next_learning_question: Which local evidence, delivery and valuation choices most alter scenario conclusions?
