work_id: coben-place-based-model
title: "CoBen: place-based co-benefits and co-costs"
work_type: research-programme
work_status: ongoing
relationship_to_lab: current-ccll-work
relationship_note: Owner-approved current programme of the Cities and Climate Learning Lab.
summary: >-
  An ongoing conditional, place-based scenario programme for assessing co-benefits and co-costs of climate action
  while retaining causal, geographical, delivery and valuation assumptions.
research_questions:
  - How can local climate scenarios represent co-benefits and co-costs without obscuring causal assumptions?
  - How should evidence, geography and valuation choices be governed and traced?
primary_theme: consequences-for-people-and-places
secondary_themes: [where-new-evidence-matters, modes-of-climate-delivery]
