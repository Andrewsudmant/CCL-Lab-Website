problem_of_understanding: >-
  Urban climate research is unevenly distributed, while the visibility or apparent similarity of a city does not establish that its evidence applies elsewhere.
central_question: >-
  Where is urban climate evidence produced, and under which contextual conditions may documented findings be informative to other cities?
how_it_investigates: >-
  The ongoing paper maps the geography of documented urban climate evidence and examines contextual conditions that may shape relevance across places.
reader_value: >-
  The work could help comparative researchers distinguish the visibility of a precedent from the conditions under which another city might plausibly learn from it.
decision_or_problem: Which existing urban climate evidence is visible and plausibly relevant beyond the places where it was produced.
existing_evidence: A verified preprint and a related external evidence-map article.
transfer_conditions: Institutional, infrastructural, climatic, political, data and social conditions may shape relevance across places.
consequential_uncertainty: Evidence gaps may limit comparison, but their importance depends on the decisions and mechanisms at issue.
evidence_status: Ongoing research grounded in a verified preprint; ongoing findings are not inferred here.
claim_boundaries: Geographic proximity, similarity or evidence volume alone does not establish applicability or transferability.
next_learning_question: Which unresolved evidence questions could materially improve decisions across several cities?
