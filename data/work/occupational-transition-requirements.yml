summary: >-
  An ongoing research line developing transparent public-evidence methods for distinguishing same-occupation
  sector changes from transitions between occupations in low-carbon workforce planning.
research_questions:
  - Which requirements distinguish sector changes from transitions between occupations?
  - How can occupational relatedness and transition requirements be calibrated from public evidence?
