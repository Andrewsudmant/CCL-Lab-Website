problem_of_understanding: >-
  Workforce planning can treat a change of sector as equivalent to a change of occupation, obscuring differences in skills, access and transition burdens.
central_question: >-
  Which requirements distinguish same-occupation sector changes from transitions between occupations in low-carbon workforce planning?
how_it_investigates: >-
  The research line develops transparent methods based on public occupational evidence to examine relatedness and calibrate possible transition requirements.
reader_value: >-
  The work could help workforce researchers and practitioners identify which occupational changes create consequential requirements for workers and places.
decision_or_problem: How to distinguish sector changes from occupation transitions in place-based low-carbon workforce planning.
existing_evidence: Public occupational evidence used to examine relatedness and transition requirements.
consequential_uncertainty: Calibration choices affect which transition requirements and workforce burdens become visible.
delivery_conditions: Workforce institutions, skills systems and employers shape whether occupational transitions are feasible.
consequences_examined: Changes in occupations, skills requirements and access to low-carbon work.
evidence_status: Current lab research line; the methodology is in development.
claim_boundaries: The work does not predict individual employment outcomes or presume that all green employment is accessible or good work.
next_learning_question: Which transition requirements are most consequential for workers and places?
